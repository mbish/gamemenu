[package]
name = "gamemenu"
version = "0.1.0"
edition = "2024"

[dependencies]
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"] }
gilrs = { version = "0.11.1", default-features = false, features = ["xinput", "serde-serialize"] }
rofi = "0.4.0"
env_logger = "0.11.10"
log = "0.4.29"
procfs = "0.18.0"

[profile.release]
debug = false
lto = true
